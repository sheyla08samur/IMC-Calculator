<!doctype html>
<html lang="en">
  <head>

        <input type="nubmer" placeholder="63.2" id="weightPatient">
        <label class="campo" for="Nombre">Estatura</label>

      </form>
        <br>
        <br>
      </form>
      <button id="btnCalculate">Calcular</button>

    <div id="resultContainer">
      <div id="result">

        <P id="imcResult"></P>
        <p id="imcStatus"></p>
        <img id="image" src="" alt="">
        <button id="btnNewCal">Nuevo</button>
      </div>
    </div>
